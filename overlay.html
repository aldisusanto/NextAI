<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextAI Spotlight Overlay</title>
  <link rel="stylesheet" href="css/overlay.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
  <div class="spotlight-container">
    <!-- Spotlight Bar -->
    <div class="spotlight-bar" id="spotlight-bar">
      <div class="input-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>

      <input 
        type="text" 
        id="spotlight-input" 
        placeholder="Tanya NextAI, atau tekan Cmd+Enter untuk tangkap layar..." 
        autocomplete="off" 
        autofocus
      />

      <div class="input-actions">
        <button id="btn-snap" class="action-btn" title="Tangkap Layar (Cmd+Enter)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span>Snap</span>
        </button>

        <button id="btn-voice" class="action-btn icon-only" title="Mode Suara">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>

        <span class="key-badge">ESC</span>
      </div>
    </div>

    <!-- Screen Preview Snippet -->
    <div class="screen-preview-box hidden" id="preview-box">
      <div class="preview-header">
        <span class="preview-tag">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          Tangkapan Layar Terdeteksi
        </span>
        <button class="btn-remove-preview" id="btn-remove-preview" title="Hapus Gambar">✕</button>
      </div>
      <div class="preview-img-wrapper">
        <img id="preview-img" src="" alt="Screen Snippet">
      </div>
    </div>

    <!-- Quick Action Pills -->
    <div class="action-pills" id="action-pills">
      <button class="pill" data-action="fix-error">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 2 1.88 1.88"></path><path d="M14.12 3.88 16 2"></path><path d="M9 7.13v-1a3.003 3.003 0 0 1 6 0v1"></path><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"></path><path d="M12 20v-9"></path><path d="M6.53 9C4.6 9.8 3.22 11.4 3 13.5"></path><path d="M17.47 9c1.93.8 3.31 2.4 3.53 4.5"></path></svg>
        Fix Error Layar
      </button>

      <button class="pill" data-action="summarize">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><line x1="10" y1="9" x2="8" y2="9"></line></svg>
        Rangkum Layar
      </button>

      <button class="pill" data-action="translate">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        Terjemahkan
      </button>

      <button class="pill" data-action="save-rag">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        Simpan ke RAG
      </button>

      <button class="pill" data-action="diagram-architecture">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-3 3"></path><circle cx="19" cy="9" r="2"></circle><circle cx="14" cy="14" r="2"></circle><circle cx="10" cy="10" r="2"></circle><circle cx="7" cy="17" r="2"></circle></svg>
        Diagram Arsitektur
      </button>
    </div>

    <!-- Response Drawer -->
    <div class="response-drawer hidden" id="response-drawer">
      <div class="drawer-header">
        <div class="drawer-title">
          <span class="status-dot connected" id="status-indicator"></span>
          <span id="drawer-title-text">Jawaban NextAI</span>
        </div>
        <div class="drawer-actions">
          <button id="btn-copy-response" title="Salin Jawaban">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          </button>
          <button id="btn-speak-response" title="Bacakan Suara">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
          </button>
          <button id="btn-close-drawer" title="Tutup Drawer">✕</button>
        </div>
      </div>
      <div class="drawer-body" id="drawer-body">
        <div class="loader-spinner hidden" id="drawer-spinner"></div>
        <div class="markdown-content" id="drawer-content"></div>
      </div>
    </div>
  </div>

  <script src="js/overlay.js"></script>
</body>
</html>
